<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">SBC Solver architecture</title>
<desc id="desc">A source-based diagram showing the EA FC web app, browser extension, local API, and constraint solver. The proposed squad returns to the web app.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111926"/><stop offset="1" stop-color="#101713"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#83e7a3"/><stop offset="1" stop-color="#cfef82"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  <style>
    text{font-family:Inter,'DejaVu Sans',sans-serif}.card{opacity:0;animation:reveal .65s ease forwards}.c1{animation-delay:.5s}.c2{animation-delay:1.3s}.c3{animation-delay:2.1s}.c4{animation-delay:2.9s}.result{opacity:0;animation:reveal .8s ease 4s forwards}.wire{stroke-dasharray:7 8;animation:dash 1.4s linear infinite}.dot{animation:pulse 1.8s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){.card,.result{animation:none;opacity:1;transform:none}.wire,.dot{animation:none}}@keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes dash{to{stroke-dashoffset:-30}}@keyframes pulse{from{opacity:.35}to{opacity:1}}
  </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<circle cx="1730" cy="104" r="320" fill="#79c388" opacity=".035"/><circle cx="90" cy="1030" r="340" fill="#6f94d5" opacity=".035"/>
<path d="M0 100h1920M0 930h1920" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="90" y="48" width="9" height="31" rx="4" fill="#a1eaa2"/>
<text x="118" y="71" fill="#cfe8d3" font-size="20" font-weight="700" letter-spacing="4">SBC SOLVER  /  ARCHITECTURE</text>
<text x="1830" y="70" text-anchor="end" fill="#9aa9aa" font-size="18" letter-spacing="2">SOURCE-BASED DIAGRAM</text>
<text x="90" y="208" fill="#f5f9f5" font-size="68" font-weight="700" letter-spacing="-2">From challenge to squad.</text>
<text x="93" y="258" fill="#a9b8b7" font-size="27">A browser extension connects the game to a local constraint solver.</text>
<!-- connectors -->
<path class="wire" d="M464 474 H520 M902 474 H958 M1340 474 H1396" fill="none" stroke="#a6dfa4" stroke-width="3"/>
<g fill="#b9f0ad"><path d="M516 468l10 6-10 6z"/><path d="M954 468l10 6-10 6z"/><path d="M1392 468l10 6-10 6z"/></g>
<!-- cards -->
<g class="card c1"><rect x="90" y="335" width="374" height="278" rx="19" fill="#1b2630" stroke="#3b5355"/><rect x="118" y="365" width="56" height="56" rx="14" fill="#293d3d"/><text x="146" y="402" text-anchor="middle" fill="#b6efb6" font-size="22" font-weight="700">01</text><text x="118" y="476" fill="#f4f8f5" font-size="33" font-weight="700">EA FC web app</text><text x="118" y="521" fill="#aabbb8" font-size="21">Club players and challenge</text><text x="118" y="552" fill="#aabbb8" font-size="21">requirements</text><text x="118" y="589" fill="#7d9992" font-size="17">BROWSER TAB</text></g>
<g class="card c2"><rect x="528" y="335" width="374" height="278" rx="19" fill="#1b2630" stroke="#3b5355"/><rect x="556" y="365" width="56" height="56" rx="14" fill="#293d3d"/><text x="584" y="402" text-anchor="middle" fill="#b6efb6" font-size="22" font-weight="700">02</text><text x="556" y="476" fill="#f4f8f5" font-size="33" font-weight="700">Extension</text><text x="556" y="521" fill="#aabbb8" font-size="21">Captures and sends</text><text x="556" y="552" fill="#aabbb8" font-size="21">challenge data</text><text x="556" y="589" fill="#7d9992" font-size="17">PAGE  /  CONTENT  /  WORKER</text></g>
<g class="card c3"><rect x="966" y="335" width="374" height="278" rx="19" fill="#1b2630" stroke="#3b5355"/><rect x="994" y="365" width="56" height="56" rx="14" fill="#293d3d"/><text x="1022" y="402" text-anchor="middle" fill="#b6efb6" font-size="22" font-weight="700">03</text><text x="994" y="476" fill="#f4f8f5" font-size="33" font-weight="700">Local API</text><text x="994" y="521" fill="#aabbb8" font-size="21">Prepares the player pool</text><text x="994" y="552" fill="#aabbb8" font-size="21">and challenge rules</text><text x="994" y="589" fill="#7d9992" font-size="17">PYTHON  /  FLASK</text></g>
<g class="card c4"><rect x="1404" y="335" width="426" height="278" rx="19" fill="#20332c" stroke="#91cd91"/><rect x="1432" y="365" width="56" height="56" rx="14" fill="#3d5c42"/><text x="1460" y="402" text-anchor="middle" fill="#d5ffcb" font-size="22" font-weight="700">04</text><text x="1432" y="476" fill="#f4f8f5" font-size="33" font-weight="700">Constraint solver</text><text x="1432" y="521" fill="#b5cbb7" font-size="21">Finds a squad that meets</text><text x="1432" y="552" fill="#b5cbb7" font-size="21">the challenge rules</text><text x="1432" y="589" fill="#a9c4a6" font-size="17">OR-TOOLS  /  CP-SAT</text></g>
<g class="result"><path d="M1617 613 V704 Q1617 728 1593 728 H315 Q277 728 277 690 V630" fill="none" stroke="url(#accent)" stroke-width="3"/><path d="M270 640l7-12 7 12" fill="none" stroke="#b9f0ad" stroke-width="3"/><rect x="692" y="696" width="540" height="64" rx="32" fill="#18261f" stroke="#83c58b"/><circle class="dot" cx="733" cy="728" r="6" fill="#b5f2a8"/><text x="757" y="735" fill="#d5efd3" font-size="22">Proposed squad returns to the web app</text></g>
<text x="90" y="851" fill="#d7e3dc" font-size="24" font-weight="700">Built for local solving</text><text x="90" y="890" fill="#94a6a0" font-size="21">The diagram describes the project flow. It is not a product screenshot.</text>
<text x="90" y="1006" fill="#78908a" font-size="19" letter-spacing="2">BROWSER EXTENSION  /  PYTHON  /  OR-TOOLS</text><text x="1830" y="1006" text-anchor="end" fill="#78908a" font-size="19">SBC SOLVER</text>
</svg>
